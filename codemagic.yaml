workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      # Must match the name of your App Store Connect API key in
      # Codemagic → Team settings → Integrations → Developer Portal.
      app_store_connect: StayAgent ASC

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.jacobjones.littlehours
      node: 22
      xcode: latest

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Sync Capacitor iOS project
        script: npx cap sync ios

      - name: Apply code signing profiles
        script: xcode-project use-profiles --project ios/App/App.xcodeproj

      - name: Set build number
        # Codemagic's BUILD_NUMBER goes up by one every build, which keeps
        # each TestFlight upload unique.
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/App/App/Info.plist

      - name: Build signed .ipa
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # Uploads to TestFlight for internal testers. Set to true to also
        # send each build to Beta App Review for external testers.
        submit_to_testflight: false
