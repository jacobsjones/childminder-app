<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>LittleHours — offline</title>
    <style>
      :root { color-scheme: light dark; --bg: #f3f8f3; --fg: #1f2d24; --muted: #5b6b60; --accent: #3f8f5f; }
      @media (prefers-color-scheme: dark) { :root { --bg: #121815; --fg: #e8efe9; --muted: #9fb0a5; --accent: #6cc08d; } }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        background: var(--bg); color: var(--fg);
        font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        padding: 24px; box-sizing: border-box; text-align: center;
      }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: var(--muted); margin: 0 0 24px; }
      button {
        font: inherit; font-weight: 600; color: #fff; background: var(--accent);
        border: 0; border-radius: 12px; padding: 12px 28px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>No connection</h1>
      <p>LittleHours needs the internet to load.<br />Check your signal or Wi-Fi and try again.</p>
      <button type="button" onclick="window.location.replace('https://childminder-app.vercel.app')">Try again</button>
    </main>
  </body>
</html>
